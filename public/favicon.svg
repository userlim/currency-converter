<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#7c5cbf" opacity="0.1" stroke="#7c5cbf" stroke-width="2"/>

  <!-- Currency symbol background -->
  <circle cx="100" cy="100" r="80" fill="#7c5cbf"/>

  <!-- Dollar sign -->
  <g transform="translate(100, 100)">
    <!-- $ symbol in white -->
    <text x="0" y="35" font-size="80" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">$</text>

    <!-- Exchange arrows -->
    <g transform="translate(-45, -40)" opacity="0.9">
      <polygon points="0,0 15,10 0,20" fill="white"/>
      <line x1="15" y1="10" x2="35" y2="10" stroke="white" stroke-width="3"/>
    </g>

    <g transform="translate(30, -40)" opacity="0.9">
      <polygon points="15,0 0,10 15,20" fill="white"/>
      <line x1="0" y1="10" x2="-20" y2="10" stroke="white" stroke-width="3"/>
    </g>
  </g>
</svg>
